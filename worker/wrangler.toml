# Split-Flap accounts API. Deployed with `npx wrangler deploy` from this folder, on the
# route below; the app itself stays on Cloudflare Pages. Secrets (BETTER_AUTH_SECRET,
# GOOGLE_CLIENT_SECRET) are set with `wrangler secret put`, never written here.
name = "split-flap-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "maclaine.se/split-flap/api/*", zone_name = "maclaine.se" }]

# Workers Logs: only the failure lines from logFailure() in src/index.js, kept three days,
# 200,000 events a day on the free plan. Invocation logs stay off, since they carry request
# metadata this app promises not to keep. CPU time is in the Worker's Metrics tab.
[observability]
enabled = true
logs = { invocation_logs = false }

[vars]
BASE_URL = "https://maclaine.se"
AV_PER_DAY = "25"   # Alpha Vantage calls a day: the standard free key, 29 Sep 2026
AV_PER_MIN = "5"
FEEDS_PER_DAY = "200"   # feed addresses new to everyone, per day (0.9.3, src/feeds.js)
SOURCES_OFF = ""   # a live data source switched off, e.g. "transit"; see src/data.js. Transitous said yes on 29 Sep 2026 (Robin D, Matrix)
GOOGLE_CLIENT_ID = "753793711246-04l6hi7vegppvdppu8883dlgiap7e03t.apps.googleusercontent.com"   # not secret

# Markets (0.9): one Durable Object in front of Alpha Vantage, so the key's allowance is
# spent once for the world, not once per data centre (see src/markets.js). The key is a
# secret (ALPHAVANTAGE_KEY); its limits are vars, raised if the open-source tier is granted.
[[durable_objects.bindings]]
name = "MARKETS"
class_name = "Markets"

[[migrations]]
tag = "v1-markets"
new_sqlite_classes = ["Markets"]

[[d1_databases]]
binding = "DB"
database_name = "split-flap"
database_id = "b893a0fb-ab4a-4ecf-8555-1da08155938b"   # created with --jurisdiction eu, 27 September 2026
migrations_dir = "migrations"

# 60 board writes a minute per account, counted by Cloudflare, not in D1
# Anonymous usage counts (0.11.5), read with _dev/stats.mjs
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "split_flap_events"

[[ratelimits]]
name = "WRITES"
namespace_id = "5051"
simple = { limit = 60, period = 60 }

# Live data (0.8): 120 uncached requests a minute per address, so one screen or a
# misbehaving script cannot run the upstream sources' allowance down
[[ratelimits]]
name = "EVENTS_RL"   # usage counts: the app sends one batch a minute, plus one when hidden
namespace_id = "5053"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DATA"
namespace_id = "5052"
simple = { limit = 120, period = 60 }

# Local development: `npm run dev` serves the app through the Worker from the plain
# static server on 8801, so the app and the API share http://localhost:8787.
[env.dev]
vars = { BASE_URL = "http://localhost:8787", DEV_APP = "http://localhost:8801", GOOGLE_CLIENT_ID = "753793711246-04l6hi7vegppvdppu8883dlgiap7e03t.apps.googleusercontent.com", AV_PER_DAY = "25", AV_PER_MIN = "5" }
durable_objects = { bindings = [{ name = "MARKETS", class_name = "Markets" }] }
# DEV_TEST=1 comes from .dev.vars when running the tests, never from here
d1_databases = [{ binding = "DB", database_name = "split-flap", database_id = "00000000-0000-0000-0000-000000000000", migrations_dir = "migrations" }]
analytics_engine_datasets = [{ binding = "EVENTS", dataset = "split_flap_events_dev" }]
ratelimits = [{ name = "WRITES", namespace_id = "5051", simple = { limit = 60, period = 60 } }, { name = "DATA", namespace_id = "5052", simple = { limit = 120, period = 60 } }, { name = "EVENTS_RL", namespace_id = "5053", simple = { limit = 10, period = 60 } }]
routes = []
